<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Program Czytanko 📖</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h1 { 
            color: #1a73e8;
            margin-top: 0;
            font-size: 1.8rem;
        }
        textarea {
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 1.5rem;
            -webkit-appearance: none; /* Naprawa stylu na iOS */
        }
        textarea:focus {
            outline: none;
            border-color: #1a73e8;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.1s, background 0.3s;
            width: 100%; /* Pełna szerokość na mobile jest wygodniejsza */
            -webkit-tap-highlight-color: transparent;
        }
        button:active {
            transform: scale(0.98);
        }
        @media (max-width: 480px) {
            .container {
                padding: 1.5rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Program Czytanko 📖</h1>
        <textarea id="text-input" placeholder="Wpisz tutaj zdanie, które AI ma przeczytać..."></textarea>
        <br>
        <button id="speak-btn">Przeczytaj tekst</button>
    </div>

    <script>
        const speakBtn = document.getElementById('speak-btn');
        const textInput = document.getElementById('text-input');

        speakBtn.addEventListener('click', () => {
            const text = textInput.value;
            
            if (text.trim() !== "") {
                // Tworzenie obiektu mowy
                const utterance = new SpeechSynthesisUtterance(text);
                
                // Opcjonalnie: ustawienie języka (pl-PL dla polskiego)
                utterance.lang = 'pl-PL';
                
                // Ustawienie parametrów głosu
                utterance.pitch = 1; // Wysokość tonu
                utterance.rate = 1;  // Prędkość czytania

                // Wykonanie syntezy mowy
                window.speechSynthesis.speak(utterance);
            } else {
                alert("Proszę wpisać jakiś tekst!");
            }
        });
    </script>

</body>
</html>
